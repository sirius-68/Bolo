appId: cm.bolo.app
name: getit, a new worker (start screen, your skill, how you work, account, you're on getit, working home, you)
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "intro-work"
    timeout: 40000
- tapOn:
    id: "intro-work"
- extendedWaitUntil:
    visible:
      id: "wland-start"
    timeout: 10000
- tapOn:
    id: "wland-start"
# step 1: the main skill
- extendedWaitUntil:
    visible:
      id: "w1-continue"
    timeout: 10000
- takeScreenshot: w01-skill
- tapOn:
    id: "w1-input"
- inputText: "plum"
- hideKeyboard
- takeScreenshot: w02-skill-typing
- tapOn:
    id: "w1-Plumber"
- takeScreenshot: w03-skill-picked
- tapOn:
    id: "w1-continue"
# step 2: how you work
- extendedWaitUntil:
    visible:
      id: "w2-continue"
    timeout: 10000
- takeScreenshot: w04-how
- tapOn:
    id: "w2-go"
- tapOn:
    id: "w2-online"
- waitForAnimationToEnd
- takeScreenshot: w05-how-picked
- scrollUntilVisible:
    element:
      id: "w2-reach-anywhere"
    direction: DOWN
    timeout: 6000
- takeScreenshot: w06-how-bottom
- tapOn:
    id: "w2-continue"
# step 3: the number (here: an account with a password, as the tour can't read a code)
- extendedWaitUntil:
    visible:
      id: "signin-send"
    timeout: 10000
- takeScreenshot: w07-number
- runFlow:
    file: account.yaml
    env:
      NAME: "Tour Wanda"
      EMAIL: ${WORK_EMAIL}
- extendedWaitUntil:
    visible:
      id: "wdone-start"
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: w08-on-getit
- tapOn:
    id: "wdone-prices"
- waitForAnimationToEnd
- takeScreenshot: w09-prices-sheet
- back
- tapOn:
    id: "wdone-start"
# the working home: available, with jobs near you
- extendedWaitUntil:
    visible:
      id: "home-big"
    timeout: 20000
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- assertVisible: "You’re available"
- takeScreenshot: w10-home-available
- tapOn:
    id: "home-big"
- assertVisible: "You’re paused"
- takeScreenshot: w11-home-paused
- tapOn:
    id: "home-big"
- assertVisible: "You’re available"
- tapOn:
    id: "tab-jobs"
- takeScreenshot: w12-jobs
- tapOn:
    id: "tab-inbox"
- takeScreenshot: w13-inbox
- tapOn: "Updates.*"
- takeScreenshot: w14-updates
- tapOn:
    id: "tab-find"
- tapOn:
    id: "home-me"
- extendedWaitUntil:
    visible:
      id: "me-mode"
    timeout: 8000
- takeScreenshot: w15-you
# the same screens in light
- tapOn: "Light"
- takeScreenshot: w16-you-light
- tapOn:
    id: "me-account"
- waitForAnimationToEnd
- takeScreenshot: w17-profile-editor-light
- back
- runFlow:
    when:
      visible:
        id: "home-me"
    commands:
      - tapOn:
          id: "home-me"
      - tapOn: "Dark"
