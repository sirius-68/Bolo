appId: cm.bolo.app
name: Regular account tour
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "skip"
    timeout: 30000
- takeScreenshot: r01-onboard
- tapOn:
    id: "skip"
- tapOn:
    id: "demo"
- takeScreenshot: r02-welcome
- tapOn:
    id: "have-account"
- tapOn:
    id: "li-contact"
- inputText: "677123456"
- hideKeyboard
- tapOn:
    id: "li-pwd"
- inputText: "password123"
- hideKeyboard
- takeScreenshot: r03-login
- tapOn:
    id: "li-submit"
- extendedWaitUntil:
    visible:
      id: "tab-feed"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "story-close"
    timeout: 6000
    optional: true
- takeScreenshot: r03b-whatsnew
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r04-feed
# The demo booking asks to confirm a finished job shortly after login: wait for it and close it first
- extendedWaitUntil:
    visible: "Not yet, something’s wrong"
    timeout: 12000
    optional: true
- runFlow: dismiss.yaml
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "ads-carousel"
    commands:
      - scrollUntilVisible:
          element:
            id: "ads-carousel"
          direction: DOWN
          centerElement: true
      # The carousel slides by itself; a tap mid-slide only stops it, so try again
      - retry:
          maxRetries: 3
          commands:
            - tapOn:
                id: "ads-carousel"
                waitToSettleTimeoutMs: 500
            - extendedWaitUntil:
                visible:
                  id: "story-cta"
                timeout: 4000
      - takeScreenshot: r04b-story-ad
      # The ad's button opens the real job (or program) page
      - tapOn:
          id: "story-cta"
      - waitForAnimationToEnd
      - takeScreenshot: r04c-ad-job
      - back
      - waitForAnimationToEnd
      - runFlow: dismiss.yaml
- scroll
- takeScreenshot: r05-feed-scrolled
- scrollUntilVisible:
    element: "Jobs"
    direction: UP
- tapOn: "Jobs"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r06-feed-jobs
# Share a job (system share sheet), then back
- runFlow:
    when:
      visible:
        id: "share-job-.*"
    commands:
      - tapOn:
          id: "share-job-.*"
      - waitForAnimationToEnd
      - takeScreenshot: r06f-share-job
      - back
      - waitForAnimationToEnd
- tapOn: "Feed"
- waitForAnimationToEnd
- takeScreenshot: r06b-feed-tab
# Comment on a post: the count goes up
- runFlow:
    when:
      visible: "Comments"
    commands:
      - tapOn: "Comments"
      - waitForAnimationToEnd
      - tapOn:
          id: "cmt-input"
      - inputText: "Looks great"
      - tapOn:
          id: "cmt-send"
      - hideKeyboard
      - takeScreenshot: r06d-comment
      - back
      - waitForAnimationToEnd
      - takeScreenshot: r06e-comment-count
- scroll
- scroll
- takeScreenshot: r06c-feed-tab-2
- scrollUntilVisible:
    element: "Jobs"
    direction: UP
- runFlow: dismiss.yaml
- tapOn: "People"
- takeScreenshot: r07-feed-people
- runFlow:
    when:
      visible: "Grace Ewane"
    commands:
      - tapOn: "Grace Ewane"
      - waitForAnimationToEnd
      - takeScreenshot: r07b-worker-profile
      - back
- tapOn: "For you"
- takeScreenshot: r08-feed-foryou
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r09-map
- tapOn:
    id: "map-people"
- waitForAnimationToEnd
- takeScreenshot: r10-map-people
- tapOn:
    id: "map-home"
- waitForAnimationToEnd
- tapOn:
    id: "tab-career"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r11-career
# CV: leaving the editor without changes goes back; create a CV; switch templates; Edit → back shows the CV again
- runFlow:
    when:
      visible: "Create my CV"
    commands:
      - tapOn: "Create my CV"
      - waitForAnimationToEnd
      - back
      - waitForAnimationToEnd
      - takeScreenshot: r11b-cv-back
      - tapOn: "Create my CV"
      - waitForAnimationToEnd
      - tapOn: "Continue"
      - tapOn:
          id: "cv-first"
      - inputText: "Eve"
      - hideKeyboard
      - scrollUntilVisible:
          element: "Save and continue"
          direction: DOWN
      - tapOn: "Save and continue"
      - tapOn: "Add later"
      - scrollUntilVisible:
          element: "Save and continue"
          direction: DOWN
      - tapOn: "Save and continue"
      - tapOn: "I have no experience yet"
      - extendedWaitUntil:
          visible:
            id: "cv-preview"
          timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: r11c-cv-basic
      - tapOn:
          id: "cv-tpl-executive"
      - waitForAnimationToEnd
      - takeScreenshot: r11d-cv-executive
      - tapOn: "Modern"
      - tapOn:
          id: "cv-tpl-aura"
      - waitForAnimationToEnd
      - takeScreenshot: r11e-cv-aura
      - tapOn:
          id: "cv-tpl-slate"
      - waitForAnimationToEnd
      - takeScreenshot: r11f-cv-slate
      - scrollUntilVisible:
          element:
            id: "cv-edit"
          direction: DOWN
      - takeScreenshot: r11f2-cv-locked
      - tapOn:
          id: "cv-edit"
      - waitForAnimationToEnd
      - back
      - extendedWaitUntil:
          visible:
            id: "cv-preview"
          timeout: 6000
      - takeScreenshot: r11g-cv-after-edit-back
      - back
      - waitForAnimationToEnd
# Career experts: list → filters → "find a mentor" → profile → book with a promo code (wallet escrow)
- scrollUntilVisible:
    element:
      id: "career-experts"
    direction: DOWN
    centerElement: true
    optional: true
- runFlow:
    when:
      visible:
        id: "career-experts"
    commands:
      - tapOn:
          id: "career-experts"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: "ex-filters"
          timeout: 8000
      - takeScreenshot: r12d-experts
      - tapOn:
          id: "ex-filters"
          waitToSettleTimeoutMs: 500
      - tapOn:
          id: "exf-goal"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12d2-filter-goal
      - tapOn:
          id: "radio-0"
          waitToSettleTimeoutMs: 500
      - tapOn:
          id: "exf-spec"
          waitToSettleTimeoutMs: 500
      - scrollUntilVisible:
          element:
            id: "multi-11"
          direction: DOWN
      - tapOn:
          id: "multi-11"
      - takeScreenshot: r12d3-filter-spec
      - tapOn:
          id: "multi-select"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12d4-filters
      - tapOn:
          id: "exf-show"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12d5-experts-filtered
      - tapOn: "Clear all"
      - scrollUntilVisible:
          element:
            id: "ex-match"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "ex-match"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12d6-match-1
      - tapOn:
          id: "match-0-5"
          waitToSettleTimeoutMs: 500
      - scrollUntilVisible:
          element:
            id: "match-1-11"
          direction: DOWN
      - tapOn:
          id: "match-1-11"
          waitToSettleTimeoutMs: 500
      - tapOn:
          id: "match-2-3"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12d7-matches
      - tapOn:
          id: "expert-ex_linda"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: "ex-select"
          timeout: 8000
      - takeScreenshot: r12d8-expert-profile
      - scrollUntilVisible:
          element:
            id: "ex-all-reviews"
          direction: DOWN
      - takeScreenshot: r12d9-expert-services
      - tapOn:
          id: "ex-all-reviews"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12d10-all-reviews
      - back
      - scrollUntilVisible:
          element:
            id: "svc-cv"
          direction: UP
      - tapOn:
          id: "svc-cv"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: "book-pay"
          timeout: 8000
      - takeScreenshot: r12d11-booking
      - tapOn:
          id: "book-promo"
          waitToSettleTimeoutMs: 500
      - tapOn:
          id: "promo-input"
      - inputText: "FIRST20"
      - takeScreenshot: r12d12-promo
      - tapOn:
          id: "promo-apply"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12d13-promo-applied
      - tapOn:
          id: "book-pay"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: "booked-title"
          timeout: 8000
      - takeScreenshot: r12d14-booked
      - tapOn:
          id: "booked-done"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12d15-profile-session
      - back
      - waitForAnimationToEnd
      - takeScreenshot: r12d16-experts-sessions
      - scrollUntilVisible:
          element:
            id: "become-expert"
          direction: DOWN
      - tapOn:
          id: "become-expert"
      - waitForAnimationToEnd
      - takeScreenshot: r12e-expert-apply
      - back
      - waitForAnimationToEnd
      - back
      - waitForAnimationToEnd
# Courses are listings: open one (its website inside bolo), save it, rate it, list your own
- scrollUntilVisible:
    element:
      id: "career-courses-all"
    direction: DOWN
    centerElement: true
    optional: true
- runFlow:
    when:
      visible:
        id: "career-courses-all"
    commands:
      - takeScreenshot: r12h-career-courses
      - tapOn:
          id: "career-courses-all"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: "cw-next"
          timeout: 6000
          optional: true
      - runFlow:
          when:
            visible:
              id: "cw-next"
          commands:
            - takeScreenshot: r12i-course-welcome
            - tapOn:
                id: "cw-next"
            - waitForAnimationToEnd
            - takeScreenshot: r12j-course-welcome-2
            - tapOn:
                id: "cw-next"
            - waitForAnimationToEnd
            - tapOn:
                id: "cw-next"
            - waitForAnimationToEnd
      - takeScreenshot: r12n-courses-explore
      - scrollUntilVisible:
          element:
            id: "course-c3"
          direction: DOWN
          centerElement: true
      - tapOn:
          id: "save-c3"
      - tapOn:
          id: "course-c3"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: "web-domain"
          timeout: 8000
      - waitForAnimationToEnd:
          timeout: 6000
      - takeScreenshot: r12k-course-website
      - tapOn:
          id: "web-more"
          waitToSettleTimeoutMs: 500
      - takeScreenshot: r12l-web-more
      - tapOn:
          id: "web-about"
          waitToSettleTimeoutMs: 500
      - tapOn:
          id: "took-course"
          waitToSettleTimeoutMs: 500
      - scrollUntilVisible:
          element:
            id: "star-5"
          direction: DOWN
      - tapOn:
          id: "star-5"
      - tapOn:
          id: "review-submit"
      - takeScreenshot: r12v-review
      - back
      - tapOn:
          id: "web-close"
          waitToSettleTimeoutMs: 500
      - swipe:
          start: 50%,35%
          end: 50%,90%
      - tapOn: "Saved.*"
      - waitForAnimationToEnd
      - takeScreenshot: r12o-saved
      - back
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "career-teach"
          direction: RIGHT
          optional: true
      - runFlow:
          when:
            visible:
              id: "career-teach"
          commands:
            - tapOn:
                id: "career-teach"
                waitToSettleTimeoutMs: 500
            - waitForAnimationToEnd
            - takeScreenshot: r12q-teach
            - tapOn:
                id: "teach-create"
                waitToSettleTimeoutMs: 500
            - tapOn:
                id: "lc-url"
            - inputText: "myschool.com/excel"
            - tapOn:
                id: "lc-title"
            - inputText: "Excel for small businesses"
            - hideKeyboard
            - takeScreenshot: r12q2-list-course
            - tapOn:
                id: "lc-cat"
                waitToSettleTimeoutMs: 500
            - tapOn: "Business"
            - scrollUntilVisible:
                element:
                  id: "lc-price"
                direction: DOWN
            - tapOn:
                id: "lc-price"
            - inputText: "15000"
            - hideKeyboard
            - scrollUntilVisible:
                element:
                  id: "lc-publish"
                direction: DOWN
            - takeScreenshot: r12q3-list-course-filled
            - tapOn:
                id: "lc-publish"
                waitToSettleTimeoutMs: 500
            - waitForAnimationToEnd
            - takeScreenshot: r12q4-teach-listed
            - back
            - waitForAnimationToEnd
- scroll
- takeScreenshot: r12-career-2
- runFlow:
    when:
      visible: "Software engineering internship"
    commands:
      - tapOn: "Software engineering internship"
      - waitForAnimationToEnd
      - takeScreenshot: r12b-internship-screen
      - back
- scrollUntilVisible:
    element: "Break into web development"
    direction: DOWN
    optional: true
- runFlow:
    when:
      visible: "Break into web development"
    commands:
      - tapOn: "Break into web development"
      - waitForAnimationToEnd
      - takeScreenshot: r12c-mentor-screen
      - back
- runFlow:
    when:
      visible:
        id: "career-mentors-all"
    commands:
      - tapOn:
          id: "career-mentors-all"
      - waitForAnimationToEnd
      - takeScreenshot: r12r-mentors
      - back
      - waitForAnimationToEnd
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r13-me
# Wallet: add money with escrow explained
- runFlow:
    when:
      visible:
        id: "me-wallet"
    commands:
      - tapOn:
          id: "me-wallet"
      - waitForAnimationToEnd
      - takeScreenshot: r13b-wallet
      - tapOn:
          id: "wallet-add"
      - waitForAnimationToEnd
      - tapOn:
          id: "tu-q-10000"
      - takeScreenshot: r13c-topup
      - tapOn:
          id: "tu-go"
      - takeScreenshot: r13d-topup-approve
      - extendedWaitUntil:
          visible:
            id: "tu-done"
          timeout: 10000
      - takeScreenshot: r13e-topup-done
      - tapOn:
          id: "tu-close"
      - waitForAnimationToEnd
      - takeScreenshot: r13f-wallet-after
      - back
      - waitForAnimationToEnd
- scroll
- takeScreenshot: r14-me-2
- scrollUntilVisible:
    element:
      id: "fab-create"
    direction: UP
- tapOn:
    id: "fab-create"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r15-create-sheet
- tapOn:
    id: "cr-mentor"
- waitForAnimationToEnd
- tapOn: "e.g. Start your career in sales"
- inputText: "Start in plumbing"
- takeScreenshot: r15b-sheet-keyboard
- hideKeyboard
- tapOn: "Choose a field"
- tapOn: "Plumber"
- tapOn:
    id: "mf-next"
- waitForAnimationToEnd
- takeScreenshot: r15c-mentor-step2
- back
- tapOn:
    id: "fab-create"
- waitForAnimationToEnd
- tapOn:
    id: "cr-need"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- tapOn:
    id: "pj-title"
- inputText: "Kitchen sink is leaking"
- hideKeyboard
- takeScreenshot: r16-post-job
- scrollUntilVisible:
    element:
      id: "pj-submit"
- tapOn:
    id: "pj-submit"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r17-job-posted
- back
- tapOn:
    id: "tab-feed"
- tapOn: "Messages"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r18-inbox
- tapOn: "Marie.*"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r18b-chat
- tapOn:
    id: "chat-input"
- inputText: "Hello, are you free tomorrow?"
- hideKeyboard
- takeScreenshot: r18c-chat-keyboard
- tapOn:
    id: "chat-send"
- hideKeyboard
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r18d-chat-sent
- back
- back
- runFlow:
    when:
      visible:
        id: "map-home"
    commands:
      - tapOn:
          id: "map-home"
      - waitForAnimationToEnd
- tapOn: "Notifications"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r19-notifs
- back
- tapOn:
    id: "tab-feed"
- waitForAnimationToEnd
- tapOn:
    id: "tab-reels"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r20-reels
- back
