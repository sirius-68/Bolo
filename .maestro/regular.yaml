appId: cm.bolo.app
name: Regular account tour
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "skip"
    timeout: 30000
- takeScreenshot: r01-onboard
- tapOn:
    id: "skip"
- tapOn:
    id: "demo"
- takeScreenshot: r02-welcome
- tapOn:
    id: "have-account"
- tapOn:
    id: "li-contact"
- inputText: "677123456"
- hideKeyboard
- tapOn:
    id: "li-pwd"
- inputText: "password123"
- hideKeyboard
- takeScreenshot: r03-login
- tapOn:
    id: "li-submit"
- extendedWaitUntil:
    visible:
      id: "tab-feed"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "story-close"
    timeout: 6000
    optional: true
- takeScreenshot: r03b-whatsnew
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r04-feed
- runFlow:
    when:
      visible:
        id: "ads-carousel"
    commands:
      - tapOn:
          id: "ads-carousel"
      - waitForAnimationToEnd
      - takeScreenshot: r04b-story-ad
      # The ad's button opens the real job (or program) page
      - tapOn:
          id: "story-cta"
      - waitForAnimationToEnd
      - takeScreenshot: r04c-ad-job
      - back
      - waitForAnimationToEnd
      - runFlow: dismiss.yaml
- scroll
- takeScreenshot: r05-feed-scrolled
- scrollUntilVisible:
    element: "Jobs"
    direction: UP
- tapOn: "Jobs"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r06-feed-jobs
- runFlow: dismiss.yaml
- tapOn: "People"
- takeScreenshot: r07-feed-people
- runFlow:
    when:
      visible: "Grace Ewane"
    commands:
      - tapOn: "Grace Ewane"
      - waitForAnimationToEnd
      - takeScreenshot: r07b-worker-profile
      - back
- tapOn: "Mentors"
- takeScreenshot: r08-feed-mentors
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r09-map
- tapOn:
    id: "map-people"
- waitForAnimationToEnd
- takeScreenshot: r10-map-people
- tapOn:
    id: "map-home"
- waitForAnimationToEnd
- tapOn:
    id: "tab-career"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r11-career
- scroll
- takeScreenshot: r12-career-2
- runFlow:
    when:
      visible: "Career experts"
    commands:
      - tapOn: "Career experts"
      - waitForAnimationToEnd
      - takeScreenshot: r12d-experts
      - scrollUntilVisible:
          element:
            id: "become-expert"
          direction: DOWN
      - tapOn:
          id: "become-expert"
      - waitForAnimationToEnd
      - takeScreenshot: r12e-expert-apply
      - runFlow:
          when:
            visible: "Verify ID"
          commands:
            - tapOn: "Verify ID"
            - waitForAnimationToEnd
            - takeScreenshot: r12f-id-verify
            - tapOn:
                id: "idv-next"
            - tapOn:
                id: "idv-doc-id"
            - takeScreenshot: r12g-id-document
            - back
            - back
      - back
      - back
- tapOn: "Software engineering internship"
- waitForAnimationToEnd
- takeScreenshot: r12b-internship-screen
- back
- scrollUntilVisible:
    element: "Break into web development"
    direction: DOWN
    optional: true
- runFlow:
    when:
      visible: "Break into web development"
    commands:
      - tapOn: "Break into web development"
      - waitForAnimationToEnd
      - takeScreenshot: r12c-mentor-screen
      - back
# Courses: enrol in the 1-minute test class → welcome → course page → lesson → My learning
- scrollUntilVisible:
    element: "Quick test class.*"
    direction: UP
    optional: true
- runFlow:
    when:
      visible: "Quick test class.*"
    commands:
      - tapOn: "Quick test class.*"
      - waitForAnimationToEnd
      - takeScreenshot: r12h-course-sheet
      - scrollUntilVisible:
          element: "Enroll for free"
          direction: DOWN
      - tapOn: "Enroll for free"
      - extendedWaitUntil:
          visible:
            id: "cw-next"
          timeout: 10000
      - takeScreenshot: r12i-course-welcome
      - tapOn:
          id: "cw-next"
      - waitForAnimationToEnd
      - takeScreenshot: r12j-course-welcome-2
      - tapOn:
          id: "cw-next"
      - waitForAnimationToEnd
      - tapOn:
          id: "cw-next"
      - extendedWaitUntil:
          visible:
            id: "course-continue"
          timeout: 8000
      - takeScreenshot: r12k-course-page
      - scrollUntilVisible:
          element:
            id: "lesson-0"
          direction: DOWN
      - takeScreenshot: r12l-course-lessons
      - tapOn:
          id: "lesson-0"
      - waitForAnimationToEnd
      - takeScreenshot: r12m-lesson
      - tapOn:
          id: "lesson-done"
      - waitForAnimationToEnd
      - back
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "career-courses-all"
          direction: DOWN
      - tapOn:
          id: "career-courses-all"
      - waitForAnimationToEnd
      - takeScreenshot: r12n-courses-explore
      - tapOn: "My learning.*"
      - waitForAnimationToEnd
      - takeScreenshot: r12o-my-learning
      - back
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "career-continue"
          direction: UP
      - takeScreenshot: r12p-career-continue
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r13-me
- scroll
- takeScreenshot: r14-me-2
- scrollUntilVisible:
    element:
      id: "fab-create"
    direction: UP
- tapOn:
    id: "fab-create"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r15-create-sheet
- tapOn:
    id: "cr-mentor"
- waitForAnimationToEnd
- tapOn: "e.g. Start your career in sales"
- inputText: "Start in plumbing"
- takeScreenshot: r15b-sheet-keyboard
- hideKeyboard
- tapOn: "Choose a field"
- tapOn: "Plumber"
- tapOn:
    id: "mf-next"
- waitForAnimationToEnd
- takeScreenshot: r15c-mentor-step2
- back
- tapOn:
    id: "fab-create"
- waitForAnimationToEnd
- tapOn:
    id: "cr-need"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- tapOn:
    id: "pj-title"
- inputText: "Kitchen sink is leaking"
- hideKeyboard
- takeScreenshot: r16-post-job
- scrollUntilVisible:
    element:
      id: "pj-submit"
- tapOn:
    id: "pj-submit"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r17-job-posted
- back
- tapOn:
    id: "tab-feed"
- tapOn: "Messages"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r18-inbox
- tapOn: "Marie.*"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r18b-chat
- tapOn:
    id: "chat-input"
- inputText: "Hello, are you free tomorrow?"
- hideKeyboard
- takeScreenshot: r18c-chat-keyboard
- tapOn:
    id: "chat-send"
- hideKeyboard
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r18d-chat-sent
- back
- back
- runFlow:
    when:
      visible:
        id: "map-home"
    commands:
      - tapOn:
          id: "map-home"
      - waitForAnimationToEnd
- tapOn: "Notifications"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r19-notifs
- back
- tapOn:
    id: "tab-feed"
- waitForAnimationToEnd
- tapOn:
    id: "tab-reels"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: r20-reels
- back
