appId: cm.bolo.app
name: The worker logs back in - sees the booking and the message, replies
---
- runFlow:
    file: _login.yaml
    env:
      EMAIL: ${WORK_EMAIL}
- takeScreenshot: b01-feed
- tapOn: "Notifications"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*liked your post.*"
    timeout: 15000
    optional: true
- takeScreenshot: b02-notifications
- assertNotVisible: "This screen hit a problem"
- back
- tapOn: "Messages"
- waitForAnimationToEnd
- takeScreenshot: b03-inbox
- tapOn: "Tour Hira"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Hello from the tour ${RUN}"
    timeout: 20000
- takeScreenshot: b04-chat-received
- tapOn:
    id: "chat-input"
- inputText: "Got it, see you soon"
- tapOn:
    id: "chat-send"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: b05-chat-replied
# the booking behind the chat, and the other person's profile
- tapOn: "View"
- waitForAnimationToEnd
- takeScreenshot: b05b-booking
- back
- tapOn: "Tour Hira"
- waitForAnimationToEnd
- takeScreenshot: b05c-profile
- back
- back
- back
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- takeScreenshot: b06-me
