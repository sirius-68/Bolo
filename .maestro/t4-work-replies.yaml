appId: cm.bolo.app
name: The worker logs back in - sees the booking and the message, replies
---
- runFlow:
    file: _login.yaml
    env:
      EMAIL: ${WORK_EMAIL}
- takeScreenshot: b01-feed
- tapOn: "Notifications"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*liked your post.*"
    timeout: 15000
    optional: true
- takeScreenshot: b02-notifications
- assertNotVisible: "This screen hit a problem"
- back
- tapOn: "Messages"
- waitForAnimationToEnd
- takeScreenshot: b03-inbox
- tapOn: "Tour Hira"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Hello from the tour ${RUN}"
    timeout: 20000
- takeScreenshot: b04-chat-received
- tapOn:
    id: "chat-input"
- inputText: "Got it, see you soon"
- tapOn:
    id: "chat-send"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: b05-chat-replied
# the booking behind the chat, and the other person's profile
- tapOn: "View"
- waitForAnimationToEnd
- takeScreenshot: b05b-booking
- back
- tapOn: "Tour Hira"
- waitForAnimationToEnd
- takeScreenshot: b05c-profile
- back
- back
- back
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- takeScreenshot: b06-me
# the city typed by hand in the first worker tour came back from the server after this fresh log-in
- tapOn:
    id: "tab-feed"
- waitForAnimationToEnd
- takeScreenshot: b07-city-after-login
- extendedWaitUntil:
    visible: "Kazan"
    timeout: 15000
# Calls screen opens from Messages
- tapOn: "Messages"
- waitForAnimationToEnd
- tapOn:
    id: "open-calls"
- waitForAnimationToEnd
- takeScreenshot: b08-calls
- assertNotVisible: "This screen hit a problem"
# a comment notification opens the post's comments at that very comment (it is marked for a moment)
- back
- back
- tapOn:
    id: "tab-feed"
- waitForAnimationToEnd
- tapOn: "Notifications"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*commented on your post.*"
    timeout: 15000
- tapOn: ".*commented on your post.*"
- extendedWaitUntil:
    visible:
      id: "cmt-focus"
    timeout: 15000
- takeScreenshot: b09-comment-focused
- back
- runFlow:
    when:
      visible:
        id: "cmt-input"
    commands:
      - back
- waitForAnimationToEnd
- back
# my own rating and reviews, on my profile
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- tapOn: "Rating"
- scrollUntilVisible:
    element:
      id: "me-reviews"
    direction: DOWN
    timeout: 15000
- takeScreenshot: b10-my-reviews
- assertNotVisible: "This screen hit a problem"
