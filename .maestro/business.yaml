appId: cm.bolo.app
name: Business account tour
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "skip"
    timeout: 30000
- tapOn:
    id: "skip"
- tapOn:
    id: "demo"
- tapOn:
    id: "create-business"
- tapOn:
    id: "bo-owner"
- inputText: "Peter Ekole"
- hideKeyboard
- tapOn:
    id: "bo-email"
- inputText: "jobs@ekole.cm"
- hideKeyboard
- tapOn:
    id: "bo-pass"
- inputText: "password123"
- hideKeyboard
- takeScreenshot: b00-bizob-owner
- tapOn:
    id: "bo-continue"
- tapOn:
    id: "bo-name"
- inputText: "Ekole Services"
- hideKeyboard
- tapOn: "Choose a sector"
- tapOn: "IT & Software"
- takeScreenshot: b01-bizob-company
- tapOn:
    id: "bo-continue"
- takeScreenshot: b02-bizob-location
- tapOn: "Continue"
- takeScreenshot: b03-bizob-hiring
- tapOn: "Continue"
- takeScreenshot: b04-bizob-verify
- tapOn:
    id: "bo-create"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b05-bizob-done
- tapOn:
    id: "bo-enter"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 15000
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b06-dashboard
- scroll
- takeScreenshot: b07-dashboard-2
- scroll
- takeScreenshot: b08-dashboard-3
- tapOn:
    id: "tab-feed"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b09-feed
- tapOn: "Talent"
- takeScreenshot: b10-talent
- tapOn:
    id: "tab-career"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b11-career
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b12-me
- tapOn:
    id: "fab-create"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b13-create
- tapOn: "Post a vacancy"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- tapOn:
    id: "pj-title"
- inputText: "Sales representative"
- hideKeyboard
- takeScreenshot: b14-post-vacancy
- scrollUntilVisible:
    element:
      id: "pj-submit"
- tapOn:
    id: "pj-submit"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b15-vacancy-sheet
- back
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b16-dashboard-with-vacancy
- tapOn:
    id: "tab-me"
- tapOn: "Settings"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: b17-settings
