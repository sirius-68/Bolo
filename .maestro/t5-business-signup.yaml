appId: cm.bolo.app
name: New business account - sign-up, business page, dashboard, post a vacancy
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "skip"
    timeout: 30000
- tapOn:
    id: "skip"
- tapOn:
    id: "create-business"
- tapOn:
    id: "bo-owner"
- inputText: "Tour Boss"
- hideKeyboard
- tapOn:
    id: "bo-email"
- inputText: ${BIZ_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "bo-pass"
    direction: DOWN
- tapOn:
    id: "bo-pass"
- inputText: ${TOUR_PASSWORD}
- hideKeyboard
- takeScreenshot: z01-owner
- tapOn:
    id: "bo-continue"
- extendedWaitUntil:
    visible:
      id: "bo-name"
    timeout: 10000
- tapOn:
    id: "bo-name"
- inputText: "Tour Works ${RUN}"
- hideKeyboard
- tapOn: "Choose a sector"
- tapOn: "IT & Software"
- waitForAnimationToEnd
- takeScreenshot: z02-business
- tapOn:
    id: "bo-continue"
- extendedWaitUntil:
    visible:
      id: "bo-city"
    timeout: 10000
- tapOn:
    id: "bo-city"
- tapOn:
    id: "city-input"
- inputText: "Douala"
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: z03-where
- tapOn:
    id: "bo-continue"
- waitForAnimationToEnd
- takeScreenshot: z04-hiring
- tapOn: "Skip for now"
- waitForAnimationToEnd
- takeScreenshot: z05-verify
- tapOn: "Verify later"
- extendedWaitUntil:
    visible:
      id: "bo-enter"
    timeout: 10000
- takeScreenshot: z06-ready
- tapOn:
    id: "bo-enter"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: z07-dashboard
- tapOn:
    id: "tab-feed"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: z08-feed
- tapOn:
    id: "tab-career"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: z09-career
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- takeScreenshot: z10-me
