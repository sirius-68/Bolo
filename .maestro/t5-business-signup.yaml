appId: cm.bolo.app
name: New business account - sign-up, business page, dashboard, post a vacancy
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "skip"
    timeout: 30000
- tapOn:
    id: "skip"
- tapOn:
    id: "create-business"
- tapOn:
    id: "bo-owner"
- inputText: "Tour Boss"
- takeScreenshot: kb-t5-01
- hideKeyboard
- tapOn:
    id: "bo-email"
- inputText: ${BIZ_EMAIL}
- takeScreenshot: kb-t5-02
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "bo-pass"
    direction: DOWN
- tapOn:
    id: "bo-pass"
- inputText: ${TOUR_PASSWORD}
- takeScreenshot: kb-t5-03
- hideKeyboard
- takeScreenshot: z01-owner
- tapOn:
    id: "bo-continue"
- extendedWaitUntil:
    visible:
      id: "bo-name"
    timeout: 10000
- tapOn:
    id: "bo-name"
- inputText: "Tour Works ${RUN}"
- takeScreenshot: kb-t5-04
- hideKeyboard
- tapOn: "Choose a sector"
- tapOn: "IT & Software"
- waitForAnimationToEnd
- takeScreenshot: z02-business
- tapOn:
    id: "bo-continue"
- extendedWaitUntil:
    visible:
      id: "bo-city"
    timeout: 10000
- tapOn:
    id: "bo-city"
- tapOn:
    id: "city-input"
- inputText: "Douala"
- takeScreenshot: kb-t5-05
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: z03-where
- tapOn:
    id: "bo-continue"
- waitForAnimationToEnd
- takeScreenshot: z04-hiring
- tapOn: "Skip for now"
- waitForAnimationToEnd
- takeScreenshot: z05-verify
- tapOn: "Verify later"
- extendedWaitUntil:
    visible:
      id: "bo-enter"
    timeout: 10000
- takeScreenshot: z06-ready
- tapOn:
    id: "bo-enter"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: z07-dashboard
- tapOn:
    id: "tab-feed"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: z08-feed
- tapOn:
    id: "tab-career"
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: z09-career
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- takeScreenshot: z10-me
# edit the business page: choosing the city opens over the form and comes back to it (it used to close the form)
- tapOn: "Edit page"
- extendedWaitUntil:
    visible:
      id: "bz-step-2"
    timeout: 10000
- tapOn:
    id: "bz-step-2"
- waitForAnimationToEnd
- tapOn:
    id: "bz-city"
- extendedWaitUntil:
    visible:
      id: "city-input"
    timeout: 10000
- tapOn:
    id: "city-input"
- inputText: "Zzqtown"
- takeScreenshot: z11-city-over-business-form
- tapOn:
    id: "city-save"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Location & contact"
    timeout: 10000
- assertVisible: "Zzqtown"
- takeScreenshot: z12-back-on-business-form
