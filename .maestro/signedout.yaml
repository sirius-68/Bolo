appId: cm.bolo.app
name: getit, signed out (opening screen, home, what do you need, workers, tabs, you, light mode)
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "intro-continue"
    timeout: 40000
- takeScreenshot: g01-intro
# the worker start screen
- tapOn:
    id: "intro-work"
- extendedWaitUntil:
    visible:
      id: "wland-start"
    timeout: 10000
- takeScreenshot: g02-worker-start
- back
# looking needs no account
- tapOn:
    id: "intro-continue"
- extendedWaitUntil:
    visible:
      id: "home-big"
    timeout: 15000
- takeScreenshot: g03-home
# the big button listens when the phone can
- tapOn:
    id: "home-big"
- runFlow:
    when:
      visible:
        id: "listen-type"
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: g03b-listening
      - tapOn:
          id: "listen-type"
- extendedWaitUntil:
    visible:
      id: "need-input"
    timeout: 10000
- takeScreenshot: g04-need
- tapOn:
    id: "need-Plumber"
- extendedWaitUntil:
    visible:
      id: "workers-prices"
    timeout: 20000
- takeScreenshot: g05-workers-plumber
# when someone offers this trade: their profile, as a client sees it
- runFlow:
    when:
      visible:
        id: "workers-top"
    commands:
      - tapOn:
          id: "workers-top"
      - extendedWaitUntil:
          visible:
            id: "profile-call"
          timeout: 10000
      - takeScreenshot: g05b-profile
      - scrollUntilVisible:
          element:
            id: "profile-book"
          direction: DOWN
          timeout: 8000
      - takeScreenshot: g05c-profile-bottom
      - tapOn:
          id: "profile-back"
- scrollUntilVisible:
    element:
      id: "workers-change"
    direction: DOWN
    timeout: 8000
- takeScreenshot: g06-workers-bottom
- tapOn:
    id: "workers-change"
# typed in your own words
- extendedWaitUntil:
    visible:
      id: "need-input"
    timeout: 10000
- tapOn:
    id: "need-input"
- inputText: "my car will not start"
- takeScreenshot: g07-need-typed
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "workers-prices"
    timeout: 20000
- takeScreenshot: g08-workers-mechanic
# asking for prices needs an account: the sign-in sheet slides up
- tapOn:
    id: "workers-prices"
- extendedWaitUntil:
    visible:
      id: "signin-send"
    timeout: 10000
- takeScreenshot: g09-signin-sheet
- back
- tapOn:
    id: "workers-close"
- tapOn:
    id: "need-close"
# the other tabs, signed out
- tapOn:
    id: "tab-jobs"
- takeScreenshot: g10-jobs-empty
- tapOn:
    id: "tab-inbox"
- takeScreenshot: g11-inbox-empty
- tapOn:
    id: "tab-find"
# you: appearance, area, sign in
- tapOn:
    id: "home-me"
- extendedWaitUntil:
    visible:
      id: "me-signin"
    timeout: 8000
- takeScreenshot: g12-you
- tapOn: "Light"
- takeScreenshot: g13-you-light
- back
- takeScreenshot: g14-home-light
- tapOn:
    id: "tab-search"
- extendedWaitUntil:
    visible:
      id: "need-input"
    timeout: 10000
- tapOn:
    id: "need-Electrician"
- extendedWaitUntil:
    visible:
      id: "workers-prices"
    timeout: 20000
- takeScreenshot: g15-workers-light
- tapOn:
    id: "workers-close"
- tapOn:
    id: "need-close"
- tapOn:
    id: "tab-inbox"
- takeScreenshot: g16-inbox-light
- tapOn:
    id: "tab-find"
- tapOn:
    id: "home-me"
- extendedWaitUntil:
    visible:
      id: "me-signin"
    timeout: 8000
# light mode reaches the sign-in sheet and the password screen too
- tapOn:
    id: "me-signin"
- extendedWaitUntil:
    visible:
      id: "signin-send"
    timeout: 10000
- takeScreenshot: g16b-signin-light
- tapOn:
    id: "signin-password"
- extendedWaitUntil:
    visible:
      id: "li-submit"
    timeout: 10000
- takeScreenshot: g16c-login-light
- back
- tapOn:
    id: "home-me"
- tapOn: "Dark"
- tapOn:
    id: "me-signin"
- extendedWaitUntil:
    visible:
      id: "signin-password"
    timeout: 10000
- tapOn:
    id: "signin-password"
- extendedWaitUntil:
    visible:
      id: "li-submit"
    timeout: 10000
- takeScreenshot: g17-login
# empty form: the app explains what's missing instead of calling the server
- tapOn:
    id: "li-submit"
- takeScreenshot: g18-login-empty
