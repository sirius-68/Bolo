appId: cm.bolo.app
# From the sign-in sheet to a new account made with a password (the tour can't read a code sent by email).
# Needs NAME and EMAIL.
---
- extendedWaitUntil:
    visible:
      id: "signin-password"
    timeout: 10000
- tapOn:
    id: "signin-password"
- extendedWaitUntil:
    visible:
      id: "li-submit"
    timeout: 10000
- tapOn: "Sign up"
- extendedWaitUntil:
    visible:
      id: "su-submit"
    timeout: 10000
- tapOn:
    id: "su-name"
- inputText: ${NAME}
- hideKeyboard
- tapOn:
    id: "su-contact"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: "su-pwd"
- inputText: ${TOUR_PASSWORD}
- hideKeyboard
- tapOn:
    id: "su-terms"
- takeScreenshot: a01-create-account
- tapOn:
    id: "su-submit"
