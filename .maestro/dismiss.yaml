appId: cm.bolo.app
---
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Not yet, something’s wrong"
    commands:
      - back
- runFlow:
    when:
      visible:
        id: "story-close"
    commands:
      - tapOn:
          id: "story-close"
