appId: cm.bolo.app
name: The job owner logs back in - sees the offer, accepts it, chats
---
- runFlow:
    file: _login.yaml
    env:
      EMAIL: ${HIRE_EMAIL}
- takeScreenshot: a01-feed
- tapOn: "Notifications"
- waitForAnimationToEnd
- takeScreenshot: a02-notifications
- back
# my own jobs live on my profile (the Jobs tab shows other people's)
- tapOn:
    id: "tab-me"
- waitForAnimationToEnd
- tapOn: "My jobs.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Tour leaking tap ${RUN}"
    timeout: 20000
- tapOn: "Tour leaking tap ${RUN}"
- waitForAnimationToEnd
- takeScreenshot: a03-my-job
- scrollUntilVisible:
    element: "Accept"
    direction: DOWN
- takeScreenshot: a04-offers
- tapOn: "Accept"
- waitForAnimationToEnd
- takeScreenshot: a05-accepted
- back
- runFlow: dismiss.yaml
- tapOn:
    id: "tab-feed"
- tapOn: "Messages"
- waitForAnimationToEnd
- takeScreenshot: a06-inbox
- tapOn: "Tour Wanda"
- waitForAnimationToEnd
- tapOn:
    id: "chat-input"
- inputText: "Hello from the tour ${RUN}"
- takeScreenshot: kb-t3-01
- tapOn:
    id: "chat-send"
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: a07-chat-sent
# the message box goes back to the bottom once the keyboard is closed
- takeScreenshot: a07b-keyboard-closed
- back
- back
# like the worker's post: it must reach their notifications (that page used to break on a like)
- tapOn:
    id: "tab-feed"
- waitForAnimationToEnd
- tapOn: "Feed"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Tour work post ${RUN}"
    timeout: 20000
    optional: true
- tapOn:
    text: "Like"
    below: "Tour work post ${RUN}"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: a08-liked
# comments: write one, like it, reply to it
- runFlow:
    when:
      visible: "Tour work post ${RUN}"
    commands:
      - tapOn:
          text: "Comments"
          below: "Tour work post ${RUN}"
      - extendedWaitUntil:
          visible:
            id: "cmt-input"
          timeout: 10000
      - takeScreenshot: a08b-comments-empty
      - tapOn:
          id: "cmt-input"
      - inputText: "Clean work ${RUN}"
      - takeScreenshot: kb-t3-02
      - tapOn:
          id: "cmt-send"
      - extendedWaitUntil:
          visible: "Clean work ${RUN}"
          timeout: 10000
      - tapOn:
          id: "cmt-like"
      - tapOn:
          id: "cmt-reply"
      - inputText: "and quick"
      - takeScreenshot: kb-t3-03
      - tapOn:
          id: "cmt-send"
      - extendedWaitUntil:
          visible: ".*and quick"
          timeout: 10000
      - takeScreenshot: a08c-comment-liked-replied
      - back
      - runFlow:
          when:
            visible:
              id: "cmt-input"
          commands:
            - back
