appId: cm.bolo.app
name: getit, someone hiring (look signed out, open a worker, make an account to message, chat, call, ask for prices)
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "intro-continue"
    timeout: 40000
- tapOn:
    id: "intro-continue"
- extendedWaitUntil:
    visible:
      id: "home-big"
    timeout: 15000
- runFlow: toneed.yaml
- tapOn:
    id: "need-Plumber"
# the worker from the tour before offers plumbing
- extendedWaitUntil:
    visible:
      id: "workers-top"
    timeout: 20000
- takeScreenshot: h01-workers
- tapOn:
    id: "workers-top"
- extendedWaitUntil:
    visible:
      id: "profile-call"
    timeout: 10000
- takeScreenshot: h02-profile
# messaging needs an account
- tapOn:
    id: "profile-chat"
- extendedWaitUntil:
    visible:
      id: "signin-send"
    timeout: 10000
- takeScreenshot: h03-signin-to-message
- runFlow:
    file: account.yaml
    env:
      NAME: "Tour Hira"
      EMAIL: ${HIRE_EMAIL}
- extendedWaitUntil:
    visible:
      id: "home-big"
    timeout: 40000
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: h04-home-signed-in
# find the plumber again and write to them
- runFlow: toneed.yaml
- tapOn:
    id: "need-Plumber"
- extendedWaitUntil:
    visible:
      id: "workers-chat"
    timeout: 20000
- tapOn:
    id: "workers-chat"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000
- takeScreenshot: h05-chat-empty
- tapOn:
    id: "chat-input"
- inputText: "Hello, my kitchen sink is leaking"
- tapOn:
    id: "chat-send"
- waitForAnimationToEnd
- hideKeyboard
- takeScreenshot: h06-chat
# the options behind the plus and the three dots
- tapOn:
    id: "chat-attach"
- waitForAnimationToEnd
- takeScreenshot: h07-chat-attach
- back
# a call through getit: it rings, then we hang up
- runFlow:
    when:
      visible:
        id: "chat-call"
    commands:
      - tapOn:
          id: "chat-call"
      - extendedWaitUntil:
          visible:
            id: "call-end"
          timeout: 15000
      - takeScreenshot: h08-calling
      - tapOn:
          id: "call-end"
      - extendedWaitUntil:
          visible:
            id: "chat-input"
          timeout: 15000
      - takeScreenshot: h09-chat-after-call
- back
# ask several plumbers for a price
- extendedWaitUntil:
    visible:
      id: "workers-prices"
    timeout: 10000
- tapOn:
    id: "workers-prices"
- extendedWaitUntil:
    visible:
      id: "pj-title"
    timeout: 20000
- takeScreenshot: h10-ask-prices
- scrollUntilVisible:
    element:
      id: "pj-submit"
    direction: DOWN
- tapOn:
    id: "pj-submit"
- waitForAnimationToEnd
- takeScreenshot: h11-request-sent
- back
- runFlow:
    when:
      visible:
        id: "workers-close"
    commands:
      - tapOn:
          id: "workers-close"
- runFlow:
    when:
      visible:
        id: "need-close"
    commands:
      - tapOn:
          id: "need-close"
- tapOn:
    id: "tab-jobs"
- takeScreenshot: h12-jobs
- tapOn:
    id: "tab-inbox"
- takeScreenshot: h13-inbox
# the chat again, in light
- tapOn:
    id: "tab-find"
- tapOn:
    id: "home-me"
- extendedWaitUntil:
    visible:
      id: "me-mode"
    timeout: 8000
- takeScreenshot: h14-you
- tapOn: "Light"
- back
- tapOn:
    id: "tab-inbox"
- takeScreenshot: h15-inbox-light
- tapOn: "Tour Wanda"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000
- takeScreenshot: h16-chat-light
- tapOn:
    id: "chat-menu"
- waitForAnimationToEnd
- takeScreenshot: h17-chat-menu-light
