appId: cm.bolo.app
name: getit, someone hiring (find the plumber, profile, account, chat, call, ask for prices, live status)
---
- launchApp:
    clearState: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible:
      id: "intro-continue"
    timeout: 40000
- tapOn:
    id: "intro-continue"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "where-skip"
    commands:
      - tapOn:
          id: "where-skip"
- extendedWaitUntil:
    visible:
      id: "home-big"
    timeout: 15000
- runFlow: toneed.yaml
- tapOn:
    id: "need-Plumber"
# the worker from the tour before offers plumbing
- extendedWaitUntil:
    visible:
      id: "workers-top"
    timeout: 20000
- takeScreenshot: h01-workers
- tapOn:
    id: "workers-top"
- extendedWaitUntil:
    visible:
      id: "profile-call"
    timeout: 10000
- takeScreenshot: h02-profile
# messaging needs an account
- tapOn:
    id: "profile-chat"
- extendedWaitUntil:
    visible:
      id: "signin-send"
    timeout: 10000
- takeScreenshot: h03-signin-to-message
- openLink: "getit://qa?email=${HIRE_EMAIL}&password=${TOUR_PASSWORD}&name=Tour%20Hira"
- extendedWaitUntil:
    visible:
      id: "home-big"
    timeout: 60000
- waitForAnimationToEnd
- runFlow: dismiss.yaml
- takeScreenshot: h04-home-signed-in
# find the plumber again and write to them
- runFlow: toneed.yaml
- tapOn:
    id: "need-Plumber"
- extendedWaitUntil:
    visible:
      id: "workers-chat"
    timeout: 20000
- tapOn:
    id: "workers-chat"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000
- takeScreenshot: h05-chat-empty
- tapOn:
    id: "chat-input"
- inputText: "Hello, my kitchen sink is leaking"
- tapOn:
    id: "chat-send"
- waitForAnimationToEnd
- hideKeyboard
- takeScreenshot: h06-chat
# the plus and the three dots
- tapOn:
    id: "chat-attach"
- waitForAnimationToEnd
- takeScreenshot: h07-chat-attach
- back
- tapOn:
    id: "chat-menu"
- waitForAnimationToEnd
- takeScreenshot: h08-chat-menu
- back
# a call through getit: it rings, then we hang up
- runFlow:
    when:
      visible:
        id: "chat-call"
    commands:
      - tapOn:
          id: "chat-call"
      - extendedWaitUntil:
          visible:
            id: "call-end"
          timeout: 15000
      - takeScreenshot: h09-calling
      - tapOn:
          id: "call-end"
      - extendedWaitUntil:
          visible:
            id: "chat-input"
          timeout: 15000
- tapOn:
    id: "chat-back"
# ask several plumbers for a price
- extendedWaitUntil:
    visible:
      id: "workers-prices"
    timeout: 10000
- tapOn:
    id: "workers-prices"
- extendedWaitUntil:
    visible:
      id: "req-need"
    timeout: 10000
# a title of its own for this run, so the next tour finds exactly this request
- tapOn:
    id: "req-need"
- eraseText: 40
- inputText: "Leaking sink ${RUN.slice(-4)}"
- hideKeyboard
- tapOn:
    id: "req-details"
- inputText: "Water drips under the sink"
- hideKeyboard
# the main button stays in view; the choices above it may need a scroll
- scrollUntilVisible:
    element:
      id: "req-where-online"
    direction: DOWN
    timeout: 6000
# this account has no area yet: the job is done online
- runFlow:
    when:
      visible: "Choose your area to continue"
    commands:
      - tapOn:
          id: "req-where-online"
- takeScreenshot: h10-get-prices
- tapOn:
    id: "req-send"
- extendedWaitUntil:
    visible:
      id: "asked-status"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: h11-asking
- tapOn:
    id: "asked-edit"
- waitForAnimationToEnd
- takeScreenshot: h12-change-request
- back
- runFlow:
    when:
      visible:
        id: "req-need"
    commands:
      - back
- tapOn:
    id: "top-close"
- runFlow:
    when:
      visible:
        id: "workers-close"
    commands:
      - tapOn:
          id: "workers-close"
- runFlow:
    when:
      visible:
        id: "need-close"
    commands:
      - tapOn:
          id: "need-close"
- tapOn:
    id: "tab-jobs"
- takeScreenshot: h13-jobs
- tapOn:
    id: "tab-inbox"
- takeScreenshot: h14-inbox
- tapOn:
    id: "tab-find"
- tapOn:
    id: "home-me"
- extendedWaitUntil:
    visible:
      id: "me-mode"
    timeout: 8000
- takeScreenshot: h15-you
- tapOn:
    id: "me-account"
- waitForAnimationToEnd
- takeScreenshot: h16-account
- back
- runFlow:
    when:
      visible:
        id: "account-save"
    commands:
      - back
# the chat in light
- tapOn:
    id: "home-me"
- tapOn: "Light"
- tapOn:
    id: "me-close"
- tapOn:
    id: "tab-inbox"
- takeScreenshot: h17-inbox-light
- tapOn: "Tour Wanda"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 15000
- takeScreenshot: h18-chat-light
- tapOn:
    id: "chat-back"
- tapOn:
    id: "tab-find"
- tapOn:
    id: "home-me"
- tapOn: "Dark"
- tapOn:
    id: "me-close"
