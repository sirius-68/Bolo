name: QA (emulator)

on:
  workflow_dispatch:
    inputs:
      apk:
        description: "APK file name in the latest-build release (empty = newest)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  qa:
    name: Emulator UI tour
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          name="${{ inputs.apk }}"
          if [ -z "$name" ]; then name=$(gh release view latest-build --json assets --jq '.assets | map(select(.name|endswith(".apk"))) | sort_by(.createdAt) | last | .name'); fi
          gh release download latest-build -p "$name" -D out
          ls -la out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .maestro/run.sh
      - name: Publish logs
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r qa-out/. /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@bolo.app commit -qm "qa ${{ github.run_id }}" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" logs:refs/heads/ci-logs/qa-${{ github.run_id }}
