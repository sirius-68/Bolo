name: Backend

# 1. test: starts a throwaway copy of Supabase, applies every migration and runs the security tests.
# 2. staging: on main, applies migrations and server functions to bolo-staging (once its ref is set).
# 3. production: only when started by hand with target = production (protect it with the
#    "production" environment's required reviewers in GitHub settings).
on:
  push:
    branches: [main]
    paths: ["supabase/**", "scripts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["supabase/**", "scripts/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy after the tests pass"
        type: choice
        options: [none, staging, production]
        default: none

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Migrations & security tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: |
          set -o pipefail
          mkdir -p ci-out
          supabase --version | tee ci-out/version.txt
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector 2>&1 | tee ci-out/start.log
      - name: Security tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee ci-out/tests.log
      - name: Migrations re-run cleanly
        run: |
          set -o pipefail
          for f in supabase/migrations/*.sql; do
            echo "re-running $f" | tee -a ci-out/rerun.log
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f "$f" 2>&1 | tee -a ci-out/rerun.log
          done
      - name: Publish logs
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r ci-out/. /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@bolo.app commit -qm "logs ${{ github.run_id }}" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" logs:refs/heads/ci-logs/backend-${{ github.run_id }} || true

  staging:
    name: Deploy to staging
    needs: test
    if: ${{ vars.STAGING_PROJECT_REF != '' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.target == 'staging') }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      AGORA_APP_ID: ${{ vars.STAGING_AGORA_APP_ID || vars.AGORA_APP_ID }}
      AGORA_APP_CERTIFICATE: ${{ secrets.STAGING_AGORA_APP_CERTIFICATE || secrets.AGORA_APP_CERTIFICATE }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      REF: ${{ vars.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations and functions
        run: |
          # CLI 3: the database password comes from SUPABASE_DB_PASSWORD; --remote targets the linked project
          supabase link --project-ref "$REF"
          supabase db push --remote --dry-run
          supabase db push --remote --yes
          # Agora for calls: the App Certificate lives only in the server functions' secrets
          if [ -n "$AGORA_APP_ID" ] && [ -n "$AGORA_APP_CERTIFICATE" ]; then
            supabase secrets set --yes --project-ref "$REF" "AGORA_APP_ID=$AGORA_APP_ID" "AGORA_APP_CERTIFICATE=$AGORA_APP_CERTIFICATE" \
              || supabase secrets set --yes "AGORA_APP_ID=$AGORA_APP_ID" "AGORA_APP_CERTIFICATE=$AGORA_APP_CERTIFICATE"
          fi
          # Push notifications: the Firebase service account and a fresh shared secret go into the functions' secrets
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            FCM_B64=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | base64 -w0)
            PUSH_SECRET=$(openssl rand -hex 32)
            echo "::add-mask::$FCM_B64"
            echo "::add-mask::$PUSH_SECRET"
            supabase secrets set --yes --project-ref "$REF" "FCM_SERVICE_ACCOUNT_B64=$FCM_B64" "PUSH_SECRET=$PUSH_SECRET"
          fi
          supabase functions deploy --remote --yes
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            # tell the database where to send new notifications (retries while the new function starts)
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /tmp/push.json -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/push" \
                -H 'Content-Type: application/json' -H "x-push-secret: $PUSH_SECRET" -d '{"setup":true}')
              cat /tmp/push.json; echo
              [ "$code" = "200" ] && break
              sleep 10
            done
            [ "$code" = "200" ] || { echo "push setup failed ($code)"; exit 1; }
          fi
      - name: Sign-in settings (codes by email and SMS; test sign-ups on staging)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMS_SENDER: ${{ vars.SMS_SENDER }}
        run: bash scripts/auth-config.sh "$REF" staging

  e2e:
    name: End-to-end test on staging
    needs: staging
    if: ${{ vars.STAGING_SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Two test accounts go through the app's main flows
        env:
          SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.STAGING_SUPABASE_KEY }}
        run: |
          set -o pipefail
          mkdir -p /tmp/e2e ci-out && cp scripts/e2e.mjs /tmp/e2e/ && cd /tmp/e2e
          npm init -y > /dev/null && npm i --no-audit --no-fund @supabase/supabase-js@2 > /dev/null
          node e2e.mjs 2>&1 | tee "$GITHUB_WORKSPACE/ci-out/e2e.log"
      - name: Publish result
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r ci-out/. /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@bolo.app commit -qm "e2e ${{ github.run_id }}" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" logs:refs/heads/ci-logs/e2e-latest || true

  production:
    name: Deploy to production
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && vars.PROD_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      # Production may live in another Supabase account: then it has its own token.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      AGORA_APP_ID: ${{ vars.AGORA_APP_ID }}
      AGORA_APP_CERTIFICATE: ${{ secrets.AGORA_APP_CERTIFICATE }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      REF: ${{ vars.PROD_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations and functions
        run: |
          # CLI 3: the database password comes from SUPABASE_DB_PASSWORD; --remote targets the linked project
          supabase link --project-ref "$REF"
          supabase db push --remote --dry-run
          supabase db push --remote --yes
          # Agora for calls: the App Certificate lives only in the server functions' secrets
          if [ -n "$AGORA_APP_ID" ] && [ -n "$AGORA_APP_CERTIFICATE" ]; then
            supabase secrets set --yes --project-ref "$REF" "AGORA_APP_ID=$AGORA_APP_ID" "AGORA_APP_CERTIFICATE=$AGORA_APP_CERTIFICATE" \
              || supabase secrets set --yes "AGORA_APP_ID=$AGORA_APP_ID" "AGORA_APP_CERTIFICATE=$AGORA_APP_CERTIFICATE"
          fi
          # Push notifications: the Firebase service account and a fresh shared secret go into the functions' secrets
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            FCM_B64=$(printf '%s' "$FCM_SERVICE_ACCOUNT" | base64 -w0)
            PUSH_SECRET=$(openssl rand -hex 32)
            echo "::add-mask::$FCM_B64"
            echo "::add-mask::$PUSH_SECRET"
            supabase secrets set --yes --project-ref "$REF" "FCM_SERVICE_ACCOUNT_B64=$FCM_B64" "PUSH_SECRET=$PUSH_SECRET"
          fi
          supabase functions deploy --remote --yes
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            # tell the database where to send new notifications (retries while the new function starts)
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /tmp/push.json -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/push" \
                -H 'Content-Type: application/json' -H "x-push-secret: $PUSH_SECRET" -d '{"setup":true}')
              cat /tmp/push.json; echo
              [ "$code" = "200" ] && break
              sleep 10
            done
            [ "$code" = "200" ] || { echo "push setup failed ($code)"; exit 1; }
          fi
      - name: Sign-in settings (codes by email and SMS)
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SMS_SENDER: ${{ vars.SMS_SENDER }}
        run: bash scripts/auth-config.sh "$REF"
