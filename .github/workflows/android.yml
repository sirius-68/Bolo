name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the APK as a GitHub Release"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Typecheck & bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          set -o pipefail
          mkdir -p ci-out
          npm install --no-audit --no-fund 2>&1 | tee -a ci-out/install.log
      - name: Align Expo SDK versions
        run: |
          set -o pipefail
          mkdir -p ci-out
          npx expo install --fix 2>&1 | tee -a ci-out/expo.log
      - name: Typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci-out
          npx tsc --noEmit 2>&1 | tee -a ci-out/tsc.log
      - name: Bundle JS (Android)
        run: |
          set -o pipefail
          mkdir -p ci-out
          npx expo export --platform android --output-dir dist 2>&1 | tee -a ci-out/export.log
      - name: Publish logs
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r ci-out/. /tmp/pub/ 2>/dev/null || true
          cp package.json /tmp/pub/ 2>/dev/null || true
          cp package-lock.json /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@bolo.app commit -qm "logs ${{ github.run_id }}" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" logs:refs/heads/ci-logs/check-${{ github.run_id }}

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install
        run: |
          set -o pipefail
          mkdir -p ci-out
          npm install --no-audit --no-fund 2>&1 | tee -a ci-out/install.log
      - name: Align Expo SDK versions
        run: |
          set -o pipefail
          mkdir -p ci-out
          npx expo install --fix 2>&1 | tee -a ci-out/expo.log
      - name: Prebuild native project
        run: |
          set -o pipefail
          mkdir -p ci-out
          npx expo prebuild --platform android --no-install 2>&1 | tee -a ci-out/prebuild.log
      - name: Gradle assembleRelease
        run: |
          set -o pipefail
          mkdir -p ci-out
          cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 2>&1 | tee -a ci-out/gradle.log
      - name: Collect APK
        run: |
          mkdir -p out ci-out
          cp android/app/build/outputs/apk/release/app-release.apk out/bolo-${{ github.run_number }}.apk
          ls -la out | tee ci-out/apk.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bolo-apk
          path: out/*.apk
      - name: Publish build to the "latest-build" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build (CI)
          prerelease: true
          make_latest: false
          files: out/*.apk
          body: |
            Automatic build from the latest commit on main (run ${{ github.run_number }}). For testing.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: bolo 1.0 (build ${{ github.run_number }})
          files: out/*.apk
          body: |
            Android APK for bolo. Download the .apk on your phone and open it to install
            (allow "Install unknown apps" for your browser when Android asks).
      - name: Publish logs
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r ci-out/. /tmp/pub/ 2>/dev/null || true
          cp package.json /tmp/pub/ 2>/dev/null || true
          cp package-lock.json /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git checkout -q -b logs && git add -A
          git -c user.name=ci -c user.email=ci@bolo.app commit -qm "logs ${{ github.run_id }}" || true
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" logs:refs/heads/ci-logs/build-${{ github.run_id }}
