name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the APK as a GitHub Release"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Typecheck & bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tee install.log
      - name: Align Expo SDK versions
        run: npx expo install --check 2>&1 | tee expo-check.log || (npx expo install --fix 2>&1 | tee -a expo-check.log)
      - name: Typecheck
        run: npx tsc --noEmit 2>&1 | tee tsc.log
      - name: Bundle JS (Android)
        run: npx expo export --platform android --output-dir dist 2>&1 | tee export.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            *.log
            package-lock.json
          if-no-files-found: ignore

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Align Expo SDK versions
        run: npx expo install --check || npx expo install --fix
      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 2>&1 | tee ../gradle.log; exit ${PIPESTATUS[0]}
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/bolo-${{ github.run_number }}.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: bolo-apk
          path: out/*.apk
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: gradle.log
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: bolo 1.0 (build ${{ github.run_number }})
          files: out/*.apk
          body: |
            Android APK for bolo. Download `bolo-${{ github.run_number }}.apk` on your phone and open it to install
            (allow "Install unknown apps" for your browser when Android asks).
