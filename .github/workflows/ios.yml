name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Align Expo SDK versions
        run: npx expo install --check || npx expo install --fix
      - name: Prebuild native project
        run: npx expo prebuild --platform ios --no-install
      - name: CocoaPods
        working-directory: ios
        run: pod install
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/bolo.xcworkspace -scheme bolo -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcode.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphonesimulator/bolo.app
      - name: Zip app
        run: cd build/Build/Products/Release-iphonesimulator && zip -qry $GITHUB_WORKSPACE/bolo-ios-simulator.zip bolo.app
      - uses: actions/upload-artifact@v4
        with:
          name: bolo-ios-simulator
          path: bolo-ios-simulator.zip
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: xcode.log
